<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Blockling Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: a dressing-room tool. Live 3D stage on the left, wardrobe panel with tabs on the right; stacks on phones. */
  :root {
    --bg: #eef1f6;
    --panel: #ffffff;
    --fg: #151b28;
    --muted: #5a6478;
    --line: #d8dee8;
    --chip: #f1f4f9;
    --accent: #2a5bd7;
    --accent-ink: #ffffff;
    /* scene: daytime baseplate */
    --sky-top: #6fb3ff;
    --sky-horizon: #d9efff;
    --sky-below: #eaf5ff;
    --ground-a: #7cbf5e;
    --ground-b: #71b454;
    --ground-side: #4c7c38;
    --ground-side-2: #3d6a2c;
    --cloud: rgba(255, 255, 255, 0.92);
    --shadow: rgba(20, 35, 20, 0.28);
    --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1018; --panel: #131a27; --fg: #e7ecf5; --muted: #98a3b9; --line: #263046; --chip: #1a2234;
      --accent: #8aa8ff; --accent-ink: #0c1018; --sky-top: #0b1630; --sky-horizon: #3d4c7c; --sky-below: #1b2546; --ground-a: #457a3e; --ground-b: #3f7138; --ground-side: #284a23; --ground-side-2: #1d3819; --cloud: rgba(200, 210, 240, 0.35); --shadow: rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1018; --panel: #131a27; --fg: #e7ecf5; --muted: #98a3b9; --line: #263046; --chip: #1a2234;
    --accent: #8aa8ff; --accent-ink: #0c1018; --sky-top: #0b1630; --sky-horizon: #3d4c7c; --sky-below: #1b2546; --ground-a: #457a3e; --ground-b: #3f7138; --ground-side: #284a23; --ground-side-2: #1d3819; --cloud: rgba(200, 210, 240, 0.35); --shadow: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
  [hidden] { display: none !important; }
  .app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 440px; }
  .stage { position: relative; min-height: 0; background: var(--sky-horizon); }
  #view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
  #view:active { cursor: grabbing; }
  #view:focus-visible { box-shadow: inset 0 0 0 3px var(--accent); }

  .stage-head { position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
  .stage-head h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: 0.01em; }
  .stage-head p { margin: 2px 0 0; color: var(--muted); font-size: 0.84rem; }
  .playing { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 0.82rem; box-shadow: 0 4px 14px rgba(0,0,0,.1); }
  .playing b { font-family: var(--font-display); }
  .stage-foot { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; pointer-events: none; }
  .stage-foot > * { pointer-events: auto; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; box-shadow: 0 4px 14px rgba(0,0,0,.1); }
  .seg button { border: 0; background: transparent; }

  button { font: 600 0.84rem/1 var(--font-display); letter-spacing: 0.02em; color: var(--fg); background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"], button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .float { box-shadow: 0 4px 14px rgba(0,0,0,.1); background: var(--panel); }
  .small { padding: 5px 9px; font-size: 0.74rem; border-radius: 999px; }

  .panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 12px 10px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); scrollbar-width: thin; }
  .tabs button { flex: none; background: transparent; border-color: transparent; }
  .tabs button[aria-selected="true"] { background: var(--accent); }
  .content { overflow-y: auto; padding-block: 16px 28px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
  .sec { display: flex; flex-direction: column; gap: 9px; }
  .sec h2 { margin: 0; font-family: var(--font-display); font-size: 0.74rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); display: flex; justify-content: space-between; }
  .sec h2 small { text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-weight: 500; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
  .tiles button { font-size: 0.8rem; padding: 10px 6px; min-height: 40px; }
  .tiles.emotes { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  .tiles.emotes button { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .tiles.emotes button span { font: 500 0.68rem var(--font-body); opacity: .7; letter-spacing: 0; }
  .colors { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .colors button { width: 30px; height: 30px; padding: 0; border-radius: 8px; border: 2px solid var(--line); }
  .colors button[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--panel) inset; }
  .colors input { width: 34px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer; }
  .colors input::-webkit-color-swatch-wrapper { padding: 3px; }
  .colors input::-webkit-color-swatch { border: none; border-radius: 5px; }
  .note { color: var(--muted); font-size: 0.8rem; line-height: 1.45; margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
  .presets button { text-align: left; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .presets button span { font: 400 0.72rem var(--font-body); color: var(--muted); letter-spacing: 0; }
  textarea { width: 100%; min-height: 64px; font: 0.78rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); resize: vertical; box-sizing: border-box; }
  input[type="number"] { width: 80px; font: 0.9rem var(--font-body); padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); }
  .toast { min-height: 1.2em; font-size: 0.8rem; color: var(--accent); }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 50vh minmax(0, 1fr); }
    .panel { border-left: 0; border-top: 1px solid var(--line); }
    .stage-head p { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="app">
  <section class="stage" aria-label="Avatar preview">
    <canvas id="view" tabindex="0" aria-label="3D avatar preview. Drag to rotate the camera, scroll to zoom."></canvas>
    <div class="stage-head">
      <div><h1>Blockling Studio</h1><p>Drag to orbit · scroll to zoom</p></div>
      <div class="playing" id="playing" hidden><span>Playing <b id="playingName">Wave</b></span><button type="button" class="small" id="stopEmote">Stop</button></div>
    </div>
    <div class="stage-foot">
      <div class="seg" role="group" aria-label="Movement preview">
        <button type="button" id="mv-idle" data-motion="idle" aria-pressed="true">Idle</button>
        <button type="button" id="mv-walk" data-motion="walk" aria-pressed="false">Walk</button>
        <button type="button" id="mv-run" data-motion="run" aria-pressed="false">Run</button>
        <button type="button" id="mv-jump" data-motion="jump" aria-pressed="false">Jump</button>
      </div>
      <button type="button" class="float" id="spinBtn" aria-pressed="true">Turntable</button>
      <button type="button" class="float" id="randBtn">Randomize</button>
    </div>
  </section>

  <aside class="panel" aria-label="Wardrobe">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="content" role="tabpanel" id="content"></div>
  </aside>
</div>

<script>
(() => {
  "use strict";

  /* ================= math ================= */
  const TAU = Math.PI * 2;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const rotX = a => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
  const rotY = a => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
  const rotZ = a => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; };
  function mul(a, b) { const r = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j]; return r; }
  const mv = (m, v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];
  const euler = e => mul(rotY(e[1]), mul(rotX(e[0]), rotZ(e[2])));
  const child = (p, off, rot) => ({ m: rot ? mul(p.m, rot) : p.m, t: add(p.t, mv(p.m, off)) });
  const I3 = [1, 0, 0, 0, 1, 0, 0, 0, 1];

  /* ================= colors ================= */
  const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const rgbStr = (c, k = 1, a = 1) => `rgba(${Math.round(clamp(c[0] * k, 0, 255))},${Math.round(clamp(c[1] * k, 0, 255))},${Math.round(clamp(c[2] * k, 0, 255))},${a})`;
  const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const WHITE = [255, 255, 255], INK = [27, 27, 38], GOLD = [242, 190, 60];
  const probe = document.createElement("span"); probe.style.display = "none"; document.body.appendChild(probe);
  const cssColor = s => { probe.style.color = ""; probe.style.color = s.trim(); const m = getComputedStyle(probe).color.match(/[\d.]+/g) || [0, 0, 0]; return [+m[0], +m[1], +m[2], m[3] === undefined ? 1 : +m[3]]; };
  let TH = {};
  function readTheme() {
    const cs = getComputedStyle(document.documentElement), g = n => cssColor(cs.getPropertyValue(n));
    TH = { skyTop: g("--sky-top"), skyHorizon: g("--sky-horizon"), skyBelow: g("--sky-below"), groundA: g("--ground-a"), groundB: g("--ground-b"), side: g("--ground-side"), side2: g("--ground-side-2"), cloud: g("--cloud"), shadow: g("--shadow"), accent: g("--accent") };
  }
  readTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ================= catalog ================= */
  const O = (...pairs) => pairs.map(p => ({ v: p[0], l: p[1] }));
  const CAT = {
    body: O(["classic", "Classic"], ["slim", "Slim"], ["broad", "Broad"], ["tall", "Tall"], ["short", "Short"], ["chunky", "Chunky"]),
    head: O(["block", "Block"], ["big", "Big"], ["wide", "Wide"], ["tall", "Tall"], ["mini", "Mini"]),
    eyes: O(["round", "Round"], ["dot", "Dot"], ["big", "Big"], ["anime", "Sparkly"], ["happy", "Happy"], ["sleepy", "Sleepy"], ["wink", "Wink"], ["star", "Star"], ["heart", "Heart"], ["angry", "Fierce"], ["cool", "Chill"], ["dizzy", "Dizzy"]),
    brows: O(["none", "None"], ["normal", "Normal"], ["thick", "Thick"], ["raised", "Raised"], ["angry", "Angry"], ["worried", "Worried"]),
    mouth: O(["smile", "Smile"], ["grin", "Grin"], ["big", "Big laugh"], ["teeth", "Teeth"], ["smirk", "Smirk"], ["flat", "Flat"], ["o", "Ooh"], ["tongue", "Tongue"], ["cat", "Cat"], ["frown", "Frown"], ["fangs", "Fangs"], ["kiss", "Kiss"]),
    fx: O(["blush", "Blush"], ["freckles", "Freckles"], ["lashes", "Lashes"], ["bandaid", "Bandage"], ["paint", "Face paint"], ["mole", "Beauty mark"]),
    facial: O(["none", "None"], ["stubble", "Stubble"], ["mustache", "Mustache"], ["goatee", "Goatee"], ["beard", "Beard"], ["fullbeard", "Full beard"]),
    hair: O(["none", "Bald"], ["buzz", "Buzz"], ["short", "Short"], ["fringe", "Bangs"], ["spiky", "Spiky"], ["slick", "Quiff"], ["curly", "Curly"], ["afro", "Afro"], ["bob", "Bob"], ["long", "Long"], ["ponytail", "Ponytail"], ["bun", "Bun"], ["pigtails", "Pigtails"], ["mohawk", "Mohawk"], ["braids", "Braids"]),
    hat: O(["none", "None"], ["cap", "Cap"], ["backcap", "Backwards cap"], ["beanie", "Beanie"], ["tophat", "Top hat"], ["cowboy", "Wide brim"], ["crown", "Crown"], ["wizard", "Wizard"], ["chef", "Chef"], ["party", "Party"], ["headphones", "Headphones"], ["bandana", "Headband"], ["helmet", "Space helmet"], ["catears", "Cat ears"], ["bunny", "Bunny ears"], ["horns", "Horns"], ["halo", "Halo"], ["antenna", "Antenna"], ["viking", "Horned helm"]),
    glasses: O(["none", "None"], ["round", "Round"], ["square", "Square"], ["nerd", "Thick"], ["shades", "Shades"], ["heart", "Heart"], ["star", "Star"], ["visor", "Visor"], ["monocle", "Monocle"], ["goggles", "Goggles"]),
    top: O(["tee", "T-shirt"], ["longsleeve", "Long sleeve"], ["tank", "Tank"], ["hoodie", "Hoodie"], ["jacket", "Jacket"], ["suit", "Suit"], ["sweater", "Sweater"], ["polo", "Polo"], ["jersey", "Jersey"], ["overalls", "Overalls"], ["dress", "Dress"], ["robe", "Robe"], ["spacesuit", "Space suit"]),
    pattern: O(["solid", "Solid"], ["stripes", "Stripes"], ["vstripes", "Pinstripe"], ["dots", "Dots"], ["checker", "Checker"], ["camo", "Camo"], ["twotone", "Two-tone"], ["star", "Star"], ["heart", "Heart"], ["bolt", "Bolt"], ["smiley", "Smiley"]),
    bottom: O(["pants", "Pants"], ["jeans", "Jeans"], ["ripped", "Ripped"], ["cargo", "Cargo"], ["track", "Track pants"], ["shorts", "Shorts"], ["skirt", "Skirt"]),
    shoes: O(["sneakers", "Sneakers"], ["hightops", "High-tops"], ["boots", "Boots"], ["sandals", "Sandals"], ["slippers", "Slippers"], ["barefoot", "Barefoot"]),
    acc: O(["backpack", "Backpack"], ["jetpack", "Jetpack"], ["guitar", "Guitar"], ["cape", "Cape"], ["wings", "Wings"], ["tail", "Tail"], ["scarf", "Scarf"], ["necklace", "Chain"], ["bowtie", "Bow tie"], ["belt", "Belt"], ["wristbands", "Wristbands"], ["earrings", "Earrings"], ["satchel", "Satchel"], ["balloon", "Balloon"]),
  };
  // items that would occupy the same space replace each other
  const CLASH = [["backpack", "jetpack", "guitar"], ["cape", "tail"], ["guitar", "tail"]];
  function addAcc(arr, v) { const out = new Set(CLASH.filter(g => g.includes(v)).flat()); return arr.filter(x => x !== v && !out.has(x)).concat([v]); }
  const EMOTES = [
    ["wave", "Wave"], ["dance", "Disco"], ["robot", "Robot"], ["shuffle", "Shuffle"], ["wiggle", "Wiggle"], ["cheer", "Cheer"],
    ["clap", "Clap"], ["bow", "Bow"], ["salute", "Salute"], ["point", "Point"], ["laugh", "Laugh"], ["shrug", "Shrug"],
    ["facepalm", "Facepalm"], ["think", "Think"], ["cry", "Cry"], ["angry", "Stomp"], ["heart", "Love"], ["flex", "Flex"],
    ["airguitar", "Air guitar"], ["kick", "Kick"], ["jacks", "Jumping jacks"], ["pushups", "Push-ups"], ["spin", "Spin"], ["stretch", "Stretch"],
    ["sit", "Sit"], ["sleep", "Nap"], ["meditate", "Float"], ["zombie", "Zombie"],
  ];
  const PAL = {
    skin: ["#ffe0c7", "#f6c9a4", "#f0c39b", "#d9a175", "#c08457", "#9c6640", "#7a4a2c", "#4f2f1d", "#a3d977", "#8fb8ff", "#c8b6ff", "#b9bec8"],
    hair: ["#1d1a1a", "#3b2a20", "#6b4329", "#a8672f", "#d9a441", "#f2dc8f", "#e9e4dc", "#9aa0a8", "#e2554a", "#ff7eb6", "#7b4dd6", "#2f7de1", "#2fbf8f"],
    eye: ["#2b2a3a", "#4a2f1e", "#2f6fd6", "#2a9d6e", "#7a4dd6", "#d64545", "#e2a62e", "#18a3b3"],
    lip: ["#5a2a33", "#2b2a3a", "#c2334a", "#e46a8c", "#8e3fb0", "#b5654a"],
    cloth: ["#ff6a3d", "#e2554a", "#f2b822", "#2fbf8f", "#2a9d6e", "#2f7de1", "#2a5bd7", "#1f2a44", "#7b4dd6", "#ff7eb6", "#f4f3ee", "#c9ccd2", "#6b7280", "#2b2f3a", "#8b5e3c", "#d9c3a0"],
  };
  const DEFAULT = {
    v: 1, body: "classic", head: "block", skin: "#f0c39b",
    eyes: "round", eyeCol: "#2b2a3a", brows: "normal", mouth: "smile", lipCol: "#5a2a33", fx: ["blush"], facial: "none",
    hair: "short", hairCol: "#3b2a20", hairCol2: "#d9a441",
    hat: "none", hatCol: "#2a5bd7", hatCol2: "#f4f3ee", glasses: "none", glassCol: "#2b2f3a",
    top: "hoodie", topCol: "#ff6a3d", topCol2: "#f4f3ee", pattern: "solid", number: 7,
    bottom: "jeans", botCol: "#2f4a7a", botCol2: "#c9d6ee",
    shoes: "sneakers", shoeCol: "#f4f3ee", soleCol: "#e2554a",
    acc: [], accCol: "#7b4dd6",
  };
  const COLOR_KEYS = ["skin", "eyeCol", "lipCol", "hairCol", "hairCol2", "hatCol", "hatCol2", "glassCol", "topCol", "topCol2", "botCol", "botCol2", "shoeCol", "soleCol", "accCol"];
  const HEX = /^#[0-9a-f]{6}$/i;
  function cleanLook(src) {
    const o = JSON.parse(JSON.stringify(DEFAULT));
    if (!src || typeof src !== "object") return o;
    for (const k of COLOR_KEYS) if (typeof src[k] === "string" && HEX.test(src[k])) o[k] = src[k].toLowerCase();
    for (const k of ["body", "head", "eyes", "brows", "mouth", "facial", "hair", "hat", "glasses", "top", "pattern", "bottom", "shoes"])
      if (CAT[k].some(x => x.v === src[k])) o[k] = src[k];
    if (Array.isArray(src.fx)) o.fx = CAT.fx.map(x => x.v).filter(v => src.fx.includes(v));
    if (Array.isArray(src.acc)) { o.acc = []; for (const v of CAT.acc.map(x => x.v).filter(v => src.acc.includes(v))) o.acc = addAcc(o.acc, v); }
    if (Number.isFinite(+src.number)) o.number = clamp(Math.round(+src.number), 0, 99);
    return o;
  }

  const PRESETS = [

      const hand = add(shR.t, mv(shR.m, [0, -(D.ah - D.aw * 0.5), 0]));
      const bf = { m: rotY(0.4 * sin(t * 0.7)), t: add(hand, [0.6 + 0.15 * sin(t * 1.3), 3.2 + 0.15 * sin(t * 1.7), 0.3]) };
      const bp = [box(bf, [0, 0.55, 0], [0.95, 1.1, 0.95], C.accCol, { grp: "balloon", deco: P => P.side && P.ell(0.3, 0.3, 0.08, 0.12, WHITE, 1, 0.6) }), box(bf, [0, -0.05, 0], [0.16, 0.12, 0.16], C.accCol, { grp: "balloon" })];
      pushFrame(bf, bp, parts.filter(p => p.grp !== "balloon" && !p.alpha), 2.5);
      extras.push({ kind: "line", a: hand, b: add(bf.t, [0, -0.1, 0]) });
    }
    return { parts, extras, root, torso, neck, shL, shR, hipL, hipR };
  }

  // Used only by the automated overlap check: which pairs of blocks cut into each other.
  function overlapReport(rig, tol = 0.03) {
    const out = [], P = rig.parts.filter(p => !p.alpha).map(p => ({ p, poly: polyOf(p) }));
    const contains = (W, o) => {
      const wp = W.pts || [0, 1, 2, 3, 4, 5, 6, 7].map(i => [W.c[0] + (i & 1 ? 0.5 : -0.5) * W.s[0], W.c[1] + (i & 2 ? 0.5 : -0.5) * W.s[1], W.c[2] + (i & 4 ? 0.5 : -0.5) * W.s[2]]);
      const mn = k => Math.min(...wp.map(q => q[k])), mx = k => Math.max(...wp.map(q => q[k]));
      const ylo = mn(1), yhi = mx(1), oc = cornersOf(o).map(q => toLocal(W.j, q));
      const pts = oc.filter(q => q[1] >= ylo && q[1] <= yhi);
      for (const [a, b] of EDGES) for (const yy of [ylo, yhi]) { const p = oc[a], q = oc[b]; if ((p[1] - yy) * (q[1] - yy) < 0) { const k = (yy - p[1]) / (q[1] - p[1]); pts.push([p[0] + (q[0] - p[0]) * k, yy, p[2] + (q[2] - p[2]) * k]); } }
      return pts.every(q => q[0] >= mn(0) - 0.02 && q[0] <= mx(0) + 0.02 && q[2] >= mn(2) - 0.02 && q[2] <= mx(2) + 0.02);
    };
    for (let i = 0; i < P.length; i++) for (let k = i + 1; k < P.length; k++) {
      const a = P[i].p, b = P[k].p;
      if (a.grp && a.grp === b.grp) continue;
      const pair = [a.grp, b.grp].sort().join("+");
      if (/^(leg[LR])\+skirt$|^skirt\+(leg[LR])$|^skirt\+torso$/.test(pair)) continue;   // legs leave through the hem; the waist is built on the torso
      const r = sat(P[i].poly, P[k].poly);
      if (r.depth <= tol) continue;
      if ((a.wrap && contains(a, b)) || (b.wrap && contains(b, a))) continue;
      out.push({ pair, a: a.kind || a.grp, b: b.kind || b.grp, depth: +r.depth.toFixed(3), axis: r.axis.map(v => +v.toFixed(2)), ya: [Math.min(...P[i].poly.v.map(q => q[1])), Math.max(...P[i].poly.v.map(q => q[1]))].map(v => +v.toFixed(2)), yb: [Math.min(...P[k].poly.v.map(q => q[1])), Math.max(...P[k].poly.v.map(q => q[1]))].map(v => +v.toFixed(2)) });
    }
    return out;
  }

  /* ================= face & clothing decoration ================= */
  function starPts(cu, cv, ru, rv, n = 5) { const p = []; for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + (i * Math.PI) / n, r = i % 2 ? 0.45 : 1; p.push([cu + Math.cos(a) * ru * r, cv + Math.sin(a) * rv * r]); } return p; }
  function heartPts(cu, cv, ru, rv) { const p = []; for (let i = 0; i < 24; i++) { const a = (i / 24) * TAU, x = 16 * Math.pow(sin(a), 3), y = 13 * cos(a) - 5 * cos(2 * a) - 2 * cos(3 * a) - cos(4 * a); p.push([cu + (x / 17) * ru, cv - (y / 17) * rv]); } return p; }
  const boltPts = (cu, cv, s, sv) => [[0.1, -1], [-0.45, 0.1], [-0.05, 0.1], [-0.2, 1], [0.45, -0.15], [0.05, -0.15], [0.3, -1]].map(([x, y]) => [cu + x * s, cv + y * sv]);
  const SEG = { 0: "abcdef", 1: "bc", 2: "abged", 3: "abgcd", 4: "fgbc", 5: "afgcd", 6: "afgedc", 7: "abc", 8: "abcdefg", 9: "abcfgd" };
  function digit(P, n, x, y, w, h, col) {
    const t = w * 0.22, tv = h * 0.11, s = SEG[n] || "";
    const R = { a: [x, x + w, y, y + tv], b: [x + w - t, x + w, y, y + h / 2], c: [x + w - t, x + w, y + h / 2, y + h], d: [x, x + w, y + h - tv, y + h], e: [x, x + t, y + h / 2, y + h], f: [x, x + t, y, y + h / 2], g: [x, x + w, y + h / 2 - tv / 2, y + h / 2 + tv / 2] };
    for (const k of s) P.quad(R[k][0], R[k][1], R[k][2], R[k][3], col);
  }

  function drawFace(P, pose) {
    if (P.face !== "front" || P.size < 5) return;
    const blink = st.clock < st.blinkUntil;
    let eyes = pose.eyeO || look.eyes;
    const mouth = pose.mouthO || look.mouth, brows = pose.browO || look.brows, fx = look.fx;
    const skinDark = mix(C.skin, [60, 30, 20], 0.35);
    if (fx.includes("blush")) { P.ell(0.18, 0.62, 0.09, 0.055, [255, 110, 120], 1, 0.38); P.ell(0.82, 0.62, 0.09, 0.055, [255, 110, 120], 1, 0.38); }
    if (fx.includes("freckles")) for (const [u, v] of [[0.16, 0.56], [0.22, 0.6], [0.19, 0.65], [0.84, 0.56], [0.78, 0.6], [0.81, 0.65]]) P.ell(u, v, 0.012, 0.012, skinDark, 1, 0.9, 8);
    if (fx.includes("paint")) for (const u of [0.13, 0.87]) for (const dv of [0, 0.06]) P.quad(u - 0.06, u + 0.06, 0.56 + dv, 0.585 + dv, C.accCol);
    if (fx.includes("mole")) P.ell(0.7, 0.74, 0.014, 0.014, INK, 1, 1, 8);
    // eyes
    const E = [0.34, 0.66], ev = 0.42, ec = C.eyeCol;
    const arc = (cu, up, col = INK) => P.line([[cu - 0.07, ev + (up ? 0.02 : -0.02)], [cu, ev + (up ? -0.04 : 0.04)], [cu + 0.07, ev + (up ? 0.02 : -0.02)]], col, 0.045);
    const openStyles = ["round", "dot", "big", "anime", "star", "heart", "angry"];
    if (blink && openStyles.includes(eyes)) eyes = "closed";
    for (let i = 0; i < 2; i++) {
      const cu = E[i];
      switch (eyes) {
        case "dot": P.ell(cu, ev, 0.05, 0.06, INK); break;
        case "round": P.ell(cu, ev, 0.07, 0.11, INK); if (P.size > 14) P.ell(cu + 0.02, ev - 0.04, 0.022, 0.03, WHITE); break;
        case "big": P.ell(cu, ev, 0.1, 0.13, WHITE); P.ell(cu, ev + 0.01, 0.07, 0.1, ec); P.ell(cu, ev + 0.02, 0.035, 0.05, INK); P.ell(cu + 0.03, ev - 0.03, 0.022, 0.03, WHITE); break;
        case "anime": P.ell(cu, ev, 0.08, 0.14, ec); P.quad(cu - 0.08, cu + 0.08, ev - 0.14, ev - 0.06, INK, 1, 0.55); P.ell(cu, ev + 0.03, 0.04, 0.07, INK, 1, 0.7); P.ell(cu + 0.03, ev - 0.05, 0.025, 0.035, WHITE); P.ell(cu - 0.03, ev + 0.07, 0.015, 0.02, WHITE); break;
        case "happy": arc(cu, true); break;
        case "closed": arc(cu, false); break;
        case "sleepy": P.poly([[cu - 0.075, ev], [cu + 0.075, ev], [cu + 0.06, ev + 0.06], [cu, ev + 0.08], [cu - 0.06, ev + 0.06]], INK); P.line([[cu - 0.09, ev - 0.005], [cu + 0.09, ev - 0.005]], INK, 0.03); break;
        case "wink": i === 0 ? (P.ell(cu, ev, 0.07, 0.11, INK), P.size > 14 && P.ell(cu + 0.02, ev - 0.04, 0.022, 0.03, WHITE)) : arc(cu, true); break;
        case "star": P.poly(starPts(cu, ev, 0.1, 0.13), ec.every(x => x < 80) ? GOLD : ec); break;
        case "heart": P.poly(heartPts(cu, ev, 0.1, 0.12), [235, 60, 90]); break;
        case "angry": P.ell(cu, ev + 0.01, 0.07, 0.1, INK); P.poly(i === 0 ? [[cu - 0.1, ev - 0.14], [cu + 0.1, ev - 0.14], [cu + 0.1, ev - 0.02]] : [[cu - 0.1, ev - 0.14], [cu + 0.1, ev - 0.14], [cu - 0.1, ev - 0.02]], C.skin, P.k); break;
        case "cool": P.line([[cu - 0.07, ev + 0.01], [cu + 0.07, ev + 0.01]], INK, 0.05); break;
        case "dizzy": P.line([[cu - 0.06, ev - 0.07], [cu + 0.06, ev + 0.07]], INK, 0.04); P.line([[cu + 0.06, ev - 0.07], [cu - 0.06, ev + 0.07]], INK, 0.04); break;
      }
      if (fx.includes("lashes") && !["closed", "happy", "cool", "dizzy"].includes(eyes)) P.line([[cu + (i ? 0.06 : -0.06), ev - 0.08], [cu + (i ? 0.11 : -0.11), ev - 0.12]], INK, 0.025);
    }
    // brows
    const bc = look.hair === "none" ? skinDark : C.hairCol;
    for (let i = 0; i < 2; i++) {
      const cu = E[i], o = i === 0 ? -1 : 1; // o: outward direction
      switch (brows) {
        case "normal": P.line([[cu - 0.06, 0.27], [cu + 0.06, 0.27]], bc, 0.035); break;
        case "thick": P.quad(cu - 0.08, cu + 0.08, 0.24, 0.29, bc); break;
        case "raised": P.line([[cu - 0.07, 0.25], [cu, 0.21], [cu + 0.07, 0.25]], bc, 0.035); break;
        case "angry": P.line([[cu + o * 0.08, 0.24], [cu - o * 0.06, 0.3]], bc, 0.045); break;
        case "worried": P.line([[cu + o * 0.08, 0.3], [cu - o * 0.06, 0.24]], bc, 0.04); break;
      }
    }
    // mouth
    const mc = C.lipCol, mv0 = 0.68;
    const curve = (w0, d0, y = mv0) => { const pts = []; for (let i = 0; i <= 10; i++) { const x = -1 + i / 5; pts.push([0.5 + x * w0, y + d0 * (1 - x * x)]); } return pts; };
    switch (mouth) {
      case "smile": P.line(curve(0.13, 0.06, 0.66), mc, 0.05); break;
      case "grin": P.poly(curve(0.15, 0.13, 0.63), mc); break;
      case "big": P.poly(curve(0.2, 0.2, 0.62), mc); P.poly(curve(0.11, 0.07, 0.75), [235, 110, 130]); break;
      case "teeth": P.poly(curve(0.17, 0.15, 0.63), mc); P.quad(0.36, 0.64, 0.63, 0.68, WHITE); break;
      case "smirk": P.line([[0.38, 0.69], [0.5, 0.7], [0.6, 0.68], [0.65, 0.64]], mc, 0.045); break;
      case "flat": P.line([[0.4, 0.7], [0.6, 0.7]], mc, 0.045); break;
      case "o": P.ell(0.5, 0.71, 0.05, 0.065, mc); break;
      case "tongue": P.line(curve(0.13, 0.06, 0.66), mc, 0.05); P.poly([[0.46, 0.715], [0.56, 0.715], [0.555, 0.79], [0.51, 0.81], [0.465, 0.79]], [235, 100, 120]); break;
      case "cat": P.line([[0.38, 0.67], [0.44, 0.71], [0.5, 0.67], [0.56, 0.71], [0.62, 0.67]], mc, 0.04); break;
      case "frown": P.line(curve(0.12, -0.05, 0.73), mc, 0.05); break;
      case "fangs": P.line(curve(0.14, 0.05, 0.66), mc, 0.05); for (const u of [0.43, 0.57]) P.poly([[u - 0.025, 0.695], [u + 0.025, 0.695], [u, 0.76]], WHITE); break;
      case "kiss": P.poly(heartPts(0.5, 0.7, 0.06, 0.05), [210, 60, 90]); break;
    }
    // facial hair drawn on the skin
    if (look.facial === "stubble") for (let i = 0; i < 26; i++) { const u = 0.2 + ((i * 37) % 60) / 100, v = 0.74 + ((i * 53) % 22) / 100; P.ell(u, v, 0.008, 0.008, mix(C.hairCol, C.skin, 0.35), 1, 0.85, 6); }
    if (look.facial === "mustache") P.poly([[0.32, 0.64], [0.42, 0.58], [0.5, 0.61], [0.58, 0.58], [0.68, 0.64], [0.6, 0.65], [0.5, 0.63], [0.4, 0.65]], C.hairCol);
    if (look.facial === "goatee") { P.quad(0.43, 0.57, 0.8, 0.97, C.hairCol); P.poly([[0.35, 0.63], [0.5, 0.6], [0.65, 0.63], [0.5, 0.645]], C.hairCol); }
    if (fx.includes("bandaid")) { P.poly([[0.72, 0.18], [0.86, 0.12], [0.89, 0.18], [0.75, 0.24]], [240, 200, 160]); P.ell(0.805, 0.18, 0.02, 0.025, [210, 160, 120]); }
    // glasses
    const gc = C.glassCol;
    switch (look.glasses) {
      case "round": for (const cu of E) P.ring(cu, ev, 0.13, 0.15, gc, 0.035); P.line([[0.47, ev - 0.02], [0.53, ev - 0.02]], gc, 0.035); break;
      case "square": for (const cu of E) P.rect(cu - 0.13, cu + 0.13, ev - 0.12, ev + 0.12, gc, 0.035); P.line([[0.47, ev - 0.03], [0.53, ev - 0.03]], gc, 0.035); break;
      case "nerd": for (const cu of E) P.rect(cu - 0.14, cu + 0.14, ev - 0.13, ev + 0.13, gc, 0.065); P.quad(0.46, 0.54, ev - 0.06, ev + 0.02, WHITE); break;
      case "shades": for (const cu of E) { P.quad(cu - 0.14, cu + 0.14, ev - 0.1, ev + 0.11, gc); P.poly([[cu - 0.1, ev - 0.08], [cu - 0.03, ev - 0.08], [cu - 0.09, ev + 0.05]], WHITE, 1, 0.3); } P.quad(0.46, 0.54, ev - 0.08, ev - 0.04, gc); break;
      case "heart": for (const cu of E) P.poly(heartPts(cu, ev, 0.14, 0.15), gc); P.quad(0.47, 0.53, ev - 0.05, ev - 0.02, gc); break;
      case "star": for (const cu of E) P.poly(starPts(cu, ev, 0.15, 0.18), gc); break;
      case "visor": P.quad(0.08, 0.92, ev - 0.11, ev + 0.1, gc, 1, 0.85); P.quad(0.1, 0.9, ev - 0.08, ev - 0.05, WHITE, 1, 0.35); break;
      case "monocle": P.ring(E[1], ev, 0.14, 0.16, GOLD, 0.035); P.line([[E[1] + 0.12, ev + 0.08], [0.95, 0.75]], GOLD, 0.015); break;
    }
  }

  function pattern(P, kind, col, emblemFaces = true) {
    const front = P.face === "front" || P.face === "back";
    switch (kind) {
      case "stripes": for (let i = 0; i < 4; i++) P.quad(0, 1, 0.12 + i * 0.22, 0.22 + i * 0.22, col); break;
      case "vstripes": for (let i = 0; i < 5; i++) P.quad(0.06 + i * 0.2, 0.1 + i * 0.2, 0, 1, col); break;
      case "dots": for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) P.ell(0.14 + x * 0.24 + (y % 2) * 0.12, 0.12 + y * 0.24, 0.045, 0.045, col, 1, 1, 10); break;
      case "checker": for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if ((x + y) % 2) P.quad(x / 4, (x + 1) / 4, y / 4, (y + 1) / 4, col); break;
      case "camo": for (const [u, v, r] of [[0.2, 0.2, 0.16], [0.7, 0.3, 0.2], [0.35, 0.7, 0.18], [0.85, 0.8, 0.14], [0.55, 0.05, 0.1]]) P.ell(u, v, r, r * 0.7, col, 1, 0.9, 10); break;
      case "twotone": P.quad(0, 1, 0.5, 1, col); break;
      case "star": if (front && emblemFaces) P.poly(starPts(0.5, 0.42, 0.24, 0.28), col); break;
      case "heart": if (front && emblemFaces) P.poly(heartPts(0.5, 0.42, 0.22, 0.24), col); break;
      case "bolt": if (front && emblemFaces) P.poly(boltPts(0.5, 0.45, 0.36, 0.32), col); break;
      case "smiley": if (front && emblemFaces) { P.ell(0.5, 0.42, 0.2, 0.22, col); P.ell(0.44, 0.37, 0.025, 0.04, INK); P.ell(0.56, 0.37, 0.025, 0.04, INK); P.line([[0.42, 0.48], [0.5, 0.53], [0.58, 0.48]], INK, 0.025); } break;
    }
  }

  function drawTorso(P) {
    if (!P.side) return;
    const f = P.face, c2 = C.topCol2, front = f === "front", backF = f === "back";
    const patterned = ["tee", "longsleeve", "tank", "hoodie", "sweater", "dress", "robe", "polo"].includes(look.top);
    if (patterned) pattern(P, look.pattern, c2);
    switch (look.top) {
      case "tee": case "longsleeve": if (front) P.poly([[0.36, 0], [0.64, 0], [0.5, 0.1]], C.skin); break;
      case "tank": if (front || backF) P.poly([[0.28, 0], [0.72, 0], [0.62, 0.2], [0.5, 0.24], [0.38, 0.2]], C.skin); break;
      case "hoodie": if (front) { P.quad(0.22, 0.78, 0.6, 0.92, C.topCol, 0.86); for (const u of [0.42, 0.58]) P.line([[u, 0.04], [u - 0.01 * (u < 0.5 ? 1 : -1), 0.34]], mix(C.topCol, WHITE, 0.55), 0.02); } break;
      case "jacket": if (front) { P.quad(0.4, 0.6, 0, 1, c2); pattern(P, look.pattern === "solid" ? "solid" : look.pattern, C.topCol, true); P.line([[0.5, 0.02], [0.5, 1]], mix(C.topCol, [0, 0, 0], 0.35), 0.015); P.poly([[0.3, 0], [0.4, 0], [0.4, 0.42]], C.topCol, 0.8); P.poly([[0.7, 0], [0.6, 0], [0.6, 0.42]], C.topCol, 0.8); P.quad(0.1, 0.3, 0.65, 0.7, C.topCol, 0.75); P.quad(0.7, 0.9, 0.65, 0.7, C.topCol, 0.75); } break;
      case "suit": if (front) { P.poly([[0.32, 0], [0.68, 0], [0.5, 0.55]], WHITE); P.poly([[0.46, 0.04], [0.54, 0.04], [0.57, 0.42], [0.5, 0.52], [0.43, 0.42]], c2); P.poly([[0.32, 0], [0.42, 0], [0.5, 0.55], [0.38, 0.3]], C.topCol, 0.8); P.poly([[0.68, 0], [0.58, 0], [0.5, 0.55], [0.62, 0.3]], C.topCol, 0.8); for (const v of [0.65, 0.8]) P.ell(0.5, v, 0.025, 0.025, INK, 1, 1, 8); P.quad(0.66, 0.84, 0.3, 0.34, WHITE, 0.9); } break;
      case "sweater": P.quad(0, 1, 0.88, 1, C.topCol, 0.8); if (front || backF) P.quad(0.3, 0.7, 0, 0.08, C.topCol, 0.8); break;
      case "polo": if (front) { P.poly([[0.3, 0], [0.5, 0], [0.38, 0.14]], c2); P.poly([[0.7, 0], [0.5, 0], [0.62, 0.14]], c2); P.line([[0.5, 0.02], [0.5, 0.3]], mix(C.topCol, [0, 0, 0], 0.3), 0.015); for (const v of [0.12, 0.24]) P.ell(0.5, v, 0.02, 0.02, WHITE, 1, 1, 8); } break;
      case "jersey": { const n = String(look.number); const digits = n.length === 1 ? [n] : [n[0], n[1]]; const W0 = front ? 0.17 : 0.22, H0 = front ? 0.36 : 0.5, y0 = front ? 0.3 : 0.2; if (front || backF) { const tot = digits.length * W0 + (digits.length - 1) * 0.06; digits.forEach((dg, i) => digit(P, +dg, 0.5 - tot / 2 + i * (W0 + 0.06), y0, W0, H0, c2)); } else P.quad(0.42, 0.58, 0, 1, c2); if (front) P.poly([[0.36, 0], [0.64, 0], [0.5, 0.14]], c2); break; }
      case "overalls": { const bc = C.botCol; P.quad(0, 1, 0.78, 1, bc); if (front) { P.quad(0.22, 0.78, 0.36, 1, bc); for (const u of [0.28, 0.72]) { P.quad(u - 0.06, u + 0.06, 0, 0.38, bc); P.ell(u, 0.38, 0.03, 0.03, GOLD, 1, 1, 8); } P.quad(0.38, 0.62, 0.5, 0.64, bc, 0.85); } if (backF) { P.poly([[0.2, 0], [0.32, 0], [0.8, 0.8], [0.68, 0.8]], bc); P.poly([[0.8, 0], [0.68, 0], [0.2, 0.8], [0.32, 0.8]], bc); } break; }
      case "dress": if (front) P.poly([[0.32, 0], [0.68, 0], [0.5, 0.18]], C.skin); P.quad(0, 1, 0.88, 1, c2); break;
      case "robe": if (front) { P.line([[0.3, 0], [0.62, 1]], mix(C.topCol, [0, 0, 0], 0.35), 0.02); P.poly([[0.34, 0], [0.66, 0], [0.5, 0.22]], C.skin); } P.quad(0, 1, 0.72, 0.82, c2); break;
      case "spacesuit": if (front) { P.quad(0.28, 0.72, 0.28, 0.6, mix(C.topCol, [0, 0, 0], 0.15)); [[0.38, [226, 85, 74]], [0.5, [47, 125, 225]], [0.62, [242, 184, 34]]].forEach(([u, col]) => P.ell(u, 0.4, 0.035, 0.04, col, 1, 1, 10)); P.quad(0.32, 0.68, 0.5, 0.54, [60, 70, 90]); } P.quad(0, 1, 0.84, 0.92, c2); break;

  function drawSkirt(P) {

  function drawPants(P) {

  }
  function drawShoe(P) {
    if (!P.side) return;

      case "sneakers": if (P.face === "front") for (const v of [0.25, 0.55]) P.line([[0.3, v], [0.7, v]], WHITE, 0.06); break;
      case "hightops": { const outer = (P.part.side === 1 && P.face === "left") || (P.part.side === -1 && P.face === "right"); if (outer) P.poly(starPts(0.5, 0.45, 0.22, 0.3), C.soleCol); P.quad(0, 1, 0, 0.12, C.soleCol); break; }

  /* ================= renderer ================= */
  const cvs = document.getElementById("view"), ctx = cvs.getContext("2d");
  let W = 1, H = 1, dpr = 1;
  function resize() { const r = cvs.getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1); W = Math.max(1, r.width); H = Math.max(1, r.height); cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr); }
  new ResizeObserver(resize).observe(cvs); resize();

  const cam = { yaw: 0.45, pitch: 0.18, dist: 16, tdist: 16, target: [0, 3, 0], focus: "full", pos: [0, 0, 0], f: [0, 0, 1], r: [1, 0, 0], u: [0, 1, 0], F: 600 };
  function updateCamera(rig, D, dt) {
    let tgt, dist;
    const neckW = rig.neck.t, torsoW = add(rig.torso.t, [0, D.th / 2, 0]);
    switch (cam.focus) {
      case "head": tgt = add(neckW, [0, D.hh * 0.6, 0]); dist = 6.2 + D.hh * 1.5; break;
      case "torso": tgt = torsoW; dist = 9.5; break;
      case "legs": tgt = [0, D.lh * 0.55, 0]; dist = 9; break;
      case "feet": tgt = [0, 0.6, 0]; dist = 7; break;
      default: tgt = [0, (D.lh + D.th + D.hh) * 0.52, 0]; dist = 11 + (D.lh + D.th + D.hh) * 1.1;
    }
    const k = 1 - Math.exp(-dt * 5);
    cam.target = cam.target.map((v, i) => lerp(v, tgt[i], k));
    cam.dist = lerp(cam.dist, dist * cam.zoom, k);
    const cp = cos(cam.pitch);
    cam.pos = add(cam.target, [cam.dist * cp * sin(cam.yaw), cam.dist * sin(cam.pitch), cam.dist * cp * cos(cam.yaw)]);
    cam.f = norm(sub(cam.target, cam.pos)); cam.r = norm(cross(cam.f, [0, 1, 0])); cam.u = cross(cam.r, cam.f);

  cam.zoom = 1;
  const toCam = p => { const d = sub(p, cam.pos); return [dot(d, cam.r), dot(d, cam.u), dot(d, cam.f)]; };
  const proj = c => [W / 2 + (c[0] * cam.F) / c[2], H * 0.5 - (c[1] * cam.F) / c[2]];
  const project = p => { const c = toCam(p); return c[2] > 0.1 ? proj(c) : null; };
  const LIGHT = norm([-0.45, 0.8, 0.55]);

  const FACES = [
    { name: "front", n: [0, 0, 1], idx: [6, 7, 5, 4] }, { name: "back", n: [0, 0, -1], idx: [3, 2, 0, 1] },
    { name: "left", n: [1, 0, 0], idx: [7, 3, 1, 5] }, { name: "right", n: [-1, 0, 0], idx: [2, 6, 4, 0] },
    { name: "top", n: [0, 1, 0], idx: [2, 3, 7, 6] }, { name: "bottom", n: [0, -1, 0], idx: [4, 5, 1, 0] },

  function makePainter(Pp, light, part, face) {
    const map = (u, v) => { const tx = Pp[0][0] + (Pp[1][0] - Pp[0][0]) * u, ty = Pp[0][1] + (Pp[1][1] - Pp[0][1]) * u, bx = Pp[3][0] + (Pp[2][0] - Pp[3][0]) * u, by = Pp[3][1] + (Pp[2][1] - Pp[3][1]) * u; return [tx + (bx - tx) * v, ty + (by - ty) * v]; };

    const path = pts => { ctx.beginPath(); pts.forEach((p, i) => { const s = map(p[0], p[1]); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }); };
    const poly = (pts, col, k = 1, a = 1) => { path(pts); ctx.closePath(); ctx.fillStyle = rgbStr(col, light * k, a); ctx.fill(); };
    const P = {
      face, part, size, k: 1, side: face !== "top" && face !== "bottom",
      poly,
      quad: (u0, u1, v0, v1, col, k = 1, a = 1) => poly([[u0, v0], [u1, v0], [u1, v1], [u0, v1]], col, k, a),
      ell: (cu, cv, ru, rv, col, k = 1, a = 1, n = 16) => { const pts = []; for (let i = 0; i < n; i++) { const t = (i / n) * TAU; pts.push([cu + ru * cos(t), cv + rv * sin(t)]); } poly(pts, col, k, a); },
      line: (pts, col, w, k = 1, a = 1) => { path(pts); ctx.strokeStyle = rgbStr(col, light * k, a); ctx.lineWidth = Math.max(0.8, size * w); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke(); },
      ring: (cu, cv, ru, rv, col, w) => { const pts = []; for (let i = 0; i <= 20; i++) { const t = (i / 20) * TAU; pts.push([cu + ru * cos(t), cv + rv * sin(t)]); } P.line(pts, col, w); },
      rect: (u0, u1, v0, v1, col, w) => P.line([[u0, v0], [u1, v0], [u1, v1], [u0, v1], [u0, v0]], col, w),

  }

  const particles = [];
  function spawnFx(kind, rig, D) {
    const head = add(rig.neck.t, mv(rig.neck.m, [0, D.hh, 0]));
    const face = add(rig.neck.t, mv(rig.neck.m, [0, D.hh * 0.55, D.hd / 2]));
    const r = Math.random;
    if (kind === "tears") for (const sx of [1, -1]) particles.push({ kind, p: add(face, mv(rig.neck.m, [sx * D.hw * 0.17, 0, 0.05])), v: [sx * 0.4, 0.6, 0.6], life: 0.9, max: 0.9, g: 9 });
    else particles.push({ kind, p: add(head, [(r() - 0.5) * 1.6, 0.2, (r() - 0.5) * 0.6]), v: [(r() - 0.5) * 0.6, 1.2 + r() * 0.6, 0], life: 1.8, max: 1.8, g: 0, rot: r() * TAU, s: 0.6 + r() * 0.5 });
  }
  function drawParticle(q) {
    const s = project(q.p); if (!s) return;
    const a = clamp(q.life / q.max * 1.4, 0, 1), sz = cam.F / Math.max(1, toCam(q.p)[2]) * 0.35 * (q.s || 1);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(s[0], s[1]);
    switch (q.kind) {
      case "hearts": ctx.beginPath(); for (let i = 0; i < 24; i++) { const t = (i / 24) * TAU, x = 16 * Math.pow(sin(t), 3), y = 13 * cos(t) - 5 * cos(2 * t) - 2 * cos(3 * t) - cos(4 * t); i ? ctx.lineTo(x / 17 * sz, -y / 17 * sz) : ctx.moveTo(x / 17 * sz, -y / 17 * sz); } ctx.fillStyle = "#ff4f7b"; ctx.fill(); break;
      case "notes": case "zzz": case "anger": ctx.font = `700 ${Math.round(sz * 1.6)}px "Chakra Petch", sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,0.35)"; const ch = q.kind === "notes" ? (q.rot > 3 ? "♪" : "♫") : q.kind === "zzz" ? "Z" : "#"; ctx.strokeText(ch, 0, 0); ctx.fillStyle = q.kind === "notes" ? rgbStr(TH.accent) : q.kind === "zzz" ? "#ffffff" : "#ff5a4a"; ctx.fillText(ch, 0, 0); break;
      case "sparkle": ctx.rotate(q.rot + q.life); ctx.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? sz * 0.25 : sz * 0.8, t = (i / 8) * TAU; ctx.lineTo(cos(t) * r, sin(t) * r); } ctx.closePath(); ctx.fillStyle = "#ffd75e"; ctx.fill(); break;
      case "tears": ctx.beginPath(); ctx.ellipse(0, 0, sz * 0.18, sz * 0.26, 0, 0, TAU); ctx.fillStyle = "#5fb7ff"; ctx.fill(); break;
      case "flame": { const fl = sz * (0.8 + 0.4 * Math.random()); ctx.beginPath(); ctx.moveTo(-fl * 0.35, 0); ctx.lineTo(fl * 0.35, 0); ctx.lineTo(0, fl * 1.8); ctx.closePath(); ctx.fillStyle = "#ff9a3d"; ctx.fill(); ctx.beginPath(); ctx.moveTo(-fl * 0.18, 0); ctx.lineTo(fl * 0.18, 0); ctx.lineTo(0, fl); ctx.closePath(); ctx.fillStyle = "#ffe48a"; ctx.fill(); break; }
    }
    ctx.restore();
  }

  /* ---- the world: sky, drifting clouds, and a floating green baseplate ---- */
  const NEAR = 0.2, PLATE = 24, TILE = 4;
  function clipNear(pts) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length], ain = a[2] >= NEAR, bin = b[2] >= NEAR;
      if (ain) out.push(a);
      if (ain !== bin) { const t = (NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]); }
    }
    return out;
  }
  function polyWorld(pts, fill) {
    const c = clipNear(pts.map(toCam));
    if (c.length < 3) return;
    ctx.beginPath(); c.forEach((p, i) => { const s = proj(p); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = fill; ctx.lineWidth = 1; ctx.stroke();
  }
  const CLOUDS = Array.from({ length: 9 }, (_, i) => ({ az: (i / 9) * TAU + sin(i * 7.1) * 0.3, el: 0.03 + ((i * 37) % 10) / 120, s: 14 + ((i * 53) % 10) }));
  function drawWorld() {
    // sky gradient that meets the horizon
    const far = toCam(add(cam.pos, [cam.f[0] * 1000, 0, cam.f[2] * 1000]));
    const hy = far[2] > 0 ? clamp(proj(far)[1], -H, H * 2) : H * 0.5, at = v => clamp(v / H, 0, 1);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgbStr(TH.skyTop)); g.addColorStop(at(hy), rgbStr(TH.skyHorizon)); g.addColorStop(Math.min(1, at(hy) + 0.0001), rgbStr(TH.skyHorizon)); g.addColorStop(1, rgbStr(TH.skyBelow));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = rgbStr(TH.cloud, 1, TH.cloud[3]);
    for (const cl of CLOUDS) {
      const az = cl.az + st.clock * 0.004, dir = [sin(az) * cos(cl.el), sin(cl.el), cos(az) * cos(cl.el)];
      const cc = toCam(add(cam.pos, [dir[0] * 300, dir[1] * 300, dir[2] * 300]));
      if (cc[2] < 1) continue;
      const p = proj(cc), u = (cl.s * cam.F) / cc[2];
      for (const [x, y, w, h] of [[-1, 0, 2.1, 0.7], [-0.45, -0.45, 1.3, 0.6], [0.5, -0.2, 1.0, 0.45]]) {
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(p[0] + x * u, p[1] + y * u, w * u, h * u, h * u * 0.3) : ctx.rect(p[0] + x * u, p[1] + y * u, w * u, h * u); ctx.fill();
      }
    }

    const sides = [
      { n: [0, 0, 1], pts: [[-PLATE, 0, PLATE], [PLATE, 0, PLATE], [PLATE, -1.4, PLATE], [-PLATE, -1.4, PLATE]], c: TH.side },
      { n: [0, 0, -1], pts: [[PLATE, 0, -PLATE], [-PLATE, 0, -PLATE], [-PLATE, -1.4, -PLATE], [PLATE, -1.4, -PLATE]], c: TH.side },
      { n: [1, 0, 0], pts: [[PLATE, 0, PLATE], [PLATE, 0, -PLATE], [PLATE, -1.4, -PLATE], [PLATE, -1.4, PLATE]], c: TH.side2 },
      { n: [-1, 0, 0], pts: [[-PLATE, 0, -PLATE], [-PLATE, 0, PLATE], [-PLATE, -1.4, PLATE], [-PLATE, -1.4, -PLATE]], c: TH.side2 },
    ];
    for (const s of sides) if (dot(s.n, sub(cam.pos, s.pts[0])) > 0) polyWorld(s.pts, rgbStr(s.c));
    const N = (PLATE * 2) / TILE;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      const x0 = -PLATE + i * TILE, z0 = -PLATE + j * TILE;

      polyWorld([[x0, 0, z0], [x0 + TILE, 0, z0], [x0 + TILE, 0, z0 + TILE], [x0, 0, z0 + TILE]], rgbStr(mix((i + j) % 2 ? TH.groundA : TH.groundB, TH.skyHorizon, fog)));
    }

    const s = 1 / (1 + st.y * 0.25), sh = [];
    for (let i = 0; i < 28; i++) { const t = (i / 28) * TAU; sh.push([cos(t) * 2.0 * s, 0.02, sin(t) * 1.4 * s]); }
    polyWorld(sh, rgbStr(TH.shadow, 1, TH.shadow[3] * s));
  }

  function drawAvatar(rig, pose) {
    const items = [], glass = [];
    for (const part of rig.parts) {
      const Wc = new Array(8), Sc = new Array(8);
      let ok = true;
      for (let i = 0; i < 8; i++) {
        // a part is either a box (centre + size) or eight explicit corners (the flared skirt)
        const local = part.pts ? part.pts[i] : [part.c[0] + (i & 1 ? 1 : -1) * part.s[0] / 2, part.c[1] + (i & 2 ? 1 : -1) * part.s[1] / 2, part.c[2] + (i & 4 ? 1 : -1) * part.s[2] / 2];
        Wc[i] = add(part.j.t, mv(part.j.m, local));
        Sc[i] = project(Wc[i]); if (!Sc[i]) ok = false;
      }
      if (!ok) continue;
      for (const f of FACES) {
        const nW = part.pts ? norm(cross(sub(Wc[f.idx[3]], Wc[f.idx[0]]), sub(Wc[f.idx[1]], Wc[f.idx[0]]))) : mv(part.j.m, f.n);

    }

    ctx.lineJoin = "round";
    const paint = F => {
      const p = F.part;
      let col = p.col;
      if (p.kind === "arm" && F.face === "bottom" && p.col === C.topCol) col = C.skin;
      ctx.beginPath(); F.pts.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath();
      ctx.fillStyle = rgbStr(col, F.light); ctx.fill();

    // front of every leg it overlaps. Repaint the skirt inside each leg's outline to make that exact.
    const skirt = rig.parts.find(p => p.kind === "skirt");
    if (skirt) {
      const hemP = add(skirt.j.t, mv(skirt.j.m, [0, skirt.hemY, 0])), hemN = mv(skirt.j.m, [0, 1, 0]);
      if (dot(sub(cam.pos, hemP), hemN) > 0) {
        const skirtFaces = items.filter(F => F.part === skirt && F.face !== "bottom");
        for (const L of items) {
          if (!L.part || L.part.kind !== "leg" || !L.part.steep) continue;

          const cx = L.pts.reduce((s, q) => s + q[0], 0) / L.pts.length, cy = L.pts.reduce((s, q) => s + q[1], 0) / L.pts.length;

      ctx.beginPath(); F.pts.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath();

  }

  /* ================= input: orbit & zoom ================= */
  let drag = null;
  cvs.addEventListener("pointerdown", e => { cvs.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
  cvs.addEventListener("pointermove", e => { if (!drag || drag.id !== e.pointerId) return; cam.yaw -= (e.clientX - drag.x) * 0.008; cam.pitch = clamp(cam.pitch + (e.clientY - drag.y) * 0.005, 0.04, 1.1); drag.x = e.clientX; drag.y = e.clientY; });
  cvs.addEventListener("pointerup", () => (drag = null)); cvs.addEventListener("pointercancel", () => (drag = null));
  cvs.addEventListener("wheel", e => { e.preventDefault(); cam.zoom = clamp(cam.zoom * Math.exp(e.deltaY * 0.001), 0.55, 1.8); }, { passive: false });

  /* ================= UI ================= */
  const TABS = [
    { id: "body", label: "Body", focus: "full" }, { id: "face", label: "Face", focus: "head" }, { id: "hair", label: "Hair", focus: "head" },
    { id: "headwear", label: "Headwear", focus: "head" }, { id: "top", label: "Tops", focus: "torso" }, { id: "bottom", label: "Bottoms", focus: "legs" },
    { id: "shoes", label: "Shoes", focus: "feet" }, { id: "extras", label: "Extras", focus: "full" }, { id: "emotes", label: "Emotes", focus: "full" },
    { id: "outfits", label: "Outfits", focus: "full" },
  ];
  let tab = store.get("tab", "body");
  if (!TABS.some(t => t.id === tab)) tab = "body";
  const tabsEl = document.getElementById("tabs"), contentEl = document.getElementById("content");
  const el = (tag, props = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === "on") for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn); else if (k === "text") n.textContent = v; else if (k in n && k !== "style") n[k] = v; else n.setAttribute(k, v); } n.append(...kids.filter(Boolean)); return n; };

  function tiles(key, label, opts = {}) {
    const multi = Array.isArray(look[key]);
    const grid = el("div", { class: "tiles" });
    for (const o of CAT[key]) {
      const on = multi ? look[key].includes(o.v) : look[key] === o.v;
      grid.append(el("button", { type: "button", id: `opt-${key}-${o.v}`, "aria-pressed": String(on), text: o.l, on: { click: () => {
        const next = Object.assign({}, look);
        if (multi) {
          let arr = look[key].slice();
          if (arr.includes(o.v)) arr = arr.filter(v => v !== o.v);
          else arr = key === "acc" ? addAcc(arr, o.v) : arr.concat([o.v]);
          next[key] = arr;
        } else next[key] = o.v;
        setLook(next);
      } } }));
    }
    return el("div", { class: "sec" }, el("h2", {}, label, opts.hint ? el("small", { text: opts.hint }) : null), grid);
  }
  function colors(key, label, pal) {
    const row = el("div", { class: "colors" });
    for (const hex of pal) row.append(el("button", { type: "button", "aria-label": `${label} ${hex}`, "aria-pressed": String(look[key] === hex), style: `background:${hex}`, on: { click: () => setLook(Object.assign({}, look, { [key]: hex })) } }));
    const inp = el("input", { type: "color", id: `col-${key}`, value: look[key], "aria-label": `Custom ${label.toLowerCase()}` });
    inp.addEventListener("input", () => { look[key] = inp.value; refreshColors(); });
    inp.addEventListener("change", () => setLook(Object.assign({}, look, { [key]: inp.value })));
    row.append(inp);
    return el("div", { class: "sec" }, el("h2", { text: label }), row);
  }

  const toast = el("div", { class: "toast", role: "status" });
  function say(msg) { toast.textContent = msg; clearTimeout(say.t); say.t = setTimeout(() => (toast.textContent = ""), 2600); }

  function renderTabs() {
    tabsEl.replaceChildren(...TABS.map(t => el("button", { type: "button", role: "tab", id: `tab-${t.id}`, "aria-selected": String(t.id === tab), text: t.label, on: { click: () => { tab = t.id; store.set("tab", tab); cam.focus = t.focus; renderTabs(); renderPanel(); } } })));
  }
  function renderPanel() {
    const keepScroll = contentEl.scrollTop;
    const S = [];
    switch (tab) {
      case "body": S.push(tiles("body", "Body type"), tiles("head", "Head shape"), colors("skin", "Skin tone", PAL.skin)); break;
      case "face": S.push(tiles("eyes", "Eyes"), colors("eyeCol", "Eye color", PAL.eye), tiles("brows", "Eyebrows"), tiles("mouth", "Mouth"), colors("lipCol", "Mouth color", PAL.lip), tiles("fx", "Face details", { hint: "pick any" }), tiles("facial", "Facial hair")); break;
      case "hair": S.push(tiles("hair", "Hairstyle"), colors("hairCol", "Hair color", PAL.hair), colors("hairCol2", "Highlights and ties", PAL.hair)); break;
      case "headwear": S.push(tiles("hat", "Hat"), colors("hatCol", "Hat color", PAL.cloth), colors("hatCol2", "Hat trim", PAL.cloth), tiles("glasses", "Glasses"), colors("glassCol", "Frame color", PAL.cloth)); break;
      case "top": {
        S.push(tiles("top", "Top"), tiles("pattern", "Print", { hint: "tees, hoodies, dresses" }), colors("topCol", "Main color", PAL.cloth), colors("topCol2", "Accent color", PAL.cloth));
        if (look.top === "jersey") { const n = el("input", { type: "number", id: "jerseyNum", min: "0", max: "99", value: String(look.number) }); n.addEventListener("change", () => setLook(Object.assign({}, look, { number: +n.value }))); S.push(el("div", { class: "sec" }, el("h2", { text: "Jersey number" }), n)); }
        break;
      }
      case "bottom": S.push(tiles("bottom", "Bottoms"), colors("botCol", "Main color", PAL.cloth), colors("botCol2", "Accent color", PAL.cloth)); break;
      case "shoes": S.push(tiles("shoes", "Shoes"), colors("shoeCol", "Shoe color", PAL.cloth), colors("soleCol", "Sole and trim", PAL.cloth)); break;
      case "extras": S.push(tiles("acc", "Accessories", { hint: "items that would overlap swap out" }), colors("accCol", "Accessory color", PAL.cloth)); break;
      case "emotes": {
        const grid = el("div", { class: "tiles emotes" });
        EMOTES.forEach(([id, label], i) => grid.append(el("button", { type: "button", id: `emote-${id}`, "aria-pressed": String(st.emote === id), on: { click: () => playEmote(st.emote === id ? null : id) } }, label, el("span", { text: i < 9 ? `key ${i + 1}` : " " }))));
        S.push(el("div", { class: "sec" }, el("h2", {}, "Emotes", el("small", { text: `${EMOTES.length} moves` })), grid), el("p", { class: "note", text: "Emotes loop until you stop them or pick a movement. Keys 1–9 play the first nine." }));
        break;
      }
      case "outfits": {
        const pre = el("div", { class: "presets" });
        for (const [name, desc, over] of PRESETS) pre.append(el("button", { type: "button", id: `preset-${name.toLowerCase().replace(/\W+/g, "-")}`, on: { click: () => { setLook(Object.assign({}, DEFAULT, over)); say(`${name} outfit on.`); } } }, name, el("span", { text: desc })));
        const slots = el("div", { class: "row" });
        for (let i = 1; i <= 3; i++) {
          const saved = store.get("slot" + i, null);
          slots.append(el("div", { class: "row" },
            el("button", { type: "button", id: `save-${i}`, text: `Save to slot ${i}`, on: { click: () => { store.set("slot" + i, look); say(`Saved to slot ${i}.`); renderPanel(); } } }),
            el("button", { type: "button", id: `load-${i}`, text: `Load ${i}`, disabled: !saved, on: { click: () => { setLook(store.get("slot" + i, look)); say(`Loaded slot ${i}.`); } } })));
        }
        const code = el("textarea", { id: "lookCode", readOnly: true, "aria-label": "Your look code" }); code.value = encodeLook(look);
        const paste = el("textarea", { id: "pasteCode", placeholder: "Paste a BL1. code here", "aria-label": "Paste a look code" });
        S.push(
          el("div", { class: "sec" }, el("h2", { text: "Preset outfits" }), pre),
          el("div", { class: "sec" }, el("h2", { text: "Start over" }), el("div", { class: "row" },
            el("button", { type: "button", id: "randomize2", text: "Randomize everything", on: { click: randomize } }),
            el("button", { type: "button", id: "resetLook", text: "Reset to default", on: { click: () => { setLook(DEFAULT); say("Back to the default look."); } } }))),
          el("div", { class: "sec" }, el("h2", {}, "Save slots", el("small", { text: "kept in this browser" })), slots),
          el("div", { class: "sec" }, el("h2", { text: "Share your look" }), code, el("div", { class: "row" },
            el("button", { type: "button", id: "copyCode", text: "Copy code", on: { click: () => { const done = () => say("Code copied."); try { navigator.clipboard.writeText(code.value).then(done, () => { code.select(); say("Press Ctrl+C to copy."); }); } catch { code.select(); say("Press Ctrl+C to copy."); } } } })),
            paste, el("div", { class: "row" }, el("button", { type: "button", id: "applyCode", text: "Apply code", on: { click: () => { const l = decodeLook(paste.value); if (l) { setLook(l); say("Look applied."); } else say("That code didn't work. It should start with BL1."); } } }))),
        );
        break;
      }
    }
    S.push(toast);
    contentEl.replaceChildren(...S);
    contentEl.scrollTop = keepScroll;
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function randomize() {
    const l = {};
    for (const k of ["body", "head", "eyes", "brows", "mouth", "facial", "hair", "hat", "glasses", "top", "pattern", "bottom", "shoes"]) l[k] = pick(CAT[k]).v;
    if (Math.random() < 0.5) l.hat = "none"; if (Math.random() < 0.55) l.glasses = "none"; if (Math.random() < 0.6) l.facial = "none";
    l.skin = pick(PAL.skin.slice(0, 8)); l.eyeCol = pick(PAL.eye); l.lipCol = pick(PAL.lip); l.hairCol = pick(PAL.hair); l.hairCol2 = pick(PAL.hair);
    for (const k of ["hatCol", "hatCol2", "glassCol", "topCol", "topCol2", "botCol", "botCol2", "shoeCol", "soleCol", "accCol"]) l[k] = pick(PAL.cloth);
    l.fx = CAT.fx.map(x => x.v).filter(() => Math.random() < 0.25);
    l.acc = CAT.acc.map(x => x.v).filter(() => Math.random() < 0.12);
    l.number = Math.floor(Math.random() * 100);
    setLook(l); say("Rolled a new look.");
  }

  const playingEl = document.getElementById("playing"), playingName = document.getElementById("playingName");
  function playEmote(id) {
    st.emote = id;
    playingEl.hidden = !id;
    if (id) { playingName.textContent = EMOTES.find(e => e[0] === id)[1]; setMotion("idle"); }
    if (tab === "emotes") renderPanel();
  }
  document.getElementById("stopEmote").addEventListener("click", () => playEmote(null));
  const motionBtns = [...document.querySelectorAll("[data-motion]")];
  function setMotion(m) { st.motion = m; motionBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.motion === m))); if (m !== "idle" && st.emote) playEmote(null); }
  motionBtns.forEach(b => b.addEventListener("click", () => setMotion(b.dataset.motion)));
  const spinBtn = document.getElementById("spinBtn");
  spinBtn.addEventListener("click", () => { st.spin = !st.spin; spinBtn.setAttribute("aria-pressed", String(st.spin)); });
  document.getElementById("randBtn").addEventListener("click", randomize);
  window.addEventListener("keydown", e => {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (/^Digit[1-9]$/.test(e.code)) { const em = EMOTES[+e.code.slice(5) - 1]; if (em) playEmote(st.emote === em[0] ? null : em[0]); }
  });
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { st.spin = false; spinBtn.setAttribute("aria-pressed", "false"); }

  if (window.__STUDIO_TEST__) window.__studio = {
    setLook: l => setLook(l, false),
    overlaps(anim, time) {
      const D = dimsOf(look);
      const pose = anim ? blend([{ pose: A[anim](time, { phase: time * 11, vy: 6 * cos(time * 3) }), w: 1 }]) : animate(0, D);
      st.clock = time || 0; st.y = anim === "jump" ? 1.5 : 0; st.speed = anim === "run" ? 16 : anim === "walk" ? 8 : 0;
      const r = overlapReport(buildRig(pose, D)); st.y = 0; st.speed = 0; return r;
    },
  };
  cam.focus = TABS.find(t => t.id === tab).focus;
  renderTabs(); renderPanel();

  /* ================= loop ================= */
  let last = performance.now(), fxAcc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const D = dimsOf(look);
    // close-up tabs turn the face toward the camera; otherwise the turntable spins
    if (cam.focus === "head" && !drag) { const d0 = cam.yaw - 0.35 - st.yaw; st.yaw += Math.atan2(sin(d0), cos(d0)) * (1 - Math.exp(-dt * 4)); }
    else if (st.spin && !drag) st.yaw += dt * 0.45;
    const pose = animate(dt, D);
    const rig = buildRig(pose, D);
    updateCamera(rig, D, dt);
    if (pose.fx) { fxAcc += dt * (pose.fx === "tears" ? 5 : 3); while (fxAcc > 1) { fxAcc -= 1; spawnFx(pose.fx, rig, D); } }
    for (let i = particles.length - 1; i >= 0; i--) { const q = particles[i]; q.life -= dt; q.v[1] -= (q.g || 0) * dt; q.p = add(q.p, q.v.map(v => v * dt)); if (q.life <= 0) particles.splice(i, 1); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawWorld();
    drawAvatar(rig, pose);
    for (const q of particles) drawParticle(q);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
